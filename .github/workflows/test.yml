name: Test converter

on:
  push:
    branches: [main]
    paths: ['**.py', '.github/workflows/**']
  pull_request:
    paths: ['**.py', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
