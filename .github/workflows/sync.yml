name: Sync AbuseIPDB feeds

on:
  schedule:
    # borestad schedules updates at :01 and :31 each hour (UTC).
    # Hourly, offset from upstream's :01 run; freshness is validated separately.
    - cron: "23 * * * *"
    # Read-only watchdog, 30 minutes after each synchronization.
    - cron: "53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abuseipdb-feed-publisher
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.schedule != '53 * * * *' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Test converter
        run: python3 -m unittest discover -s tests -v

      - name: Download, validate, and convert all feeds
        id: convert
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          old_head="$(git ls-remote origin refs/heads/feeds | cut -f1)"
          previous=()
          if [[ -n "$old_head" ]]; then
            # Fetch only the small manifest until we know upstream has changed.
            curl --fail --silent --show-error --location --retry 2 --max-time 180 \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$old_head/manifest.json" \
              --output "$RUNNER_TEMP/previous-manifest.json"
            previous=(--previous-manifest "$RUNNER_TEMP/previous-manifest.json")
          fi
          echo "FEEDS_OLD_HEAD=$old_head" >> "$GITHUB_ENV"
          python3 sync.py --output "$RUNNER_TEMP/feeds" --skip-unchanged "${previous[@]}"

      - name: Publish all ten time windows on feeds branch
        if: steps.convert.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          old_tree=''
          if [[ -n "$FEEDS_OLD_HEAD" ]]; then
            git fetch --no-tags --depth=1 origin refs/heads/feeds
            [[ "$(git rev-parse FETCH_HEAD)" == "$FEEDS_OLD_HEAD" ]] || { echo 'feeds changed during conversion; retry this run'; exit 1; }
            old_tree="$(git rev-parse 'FETCH_HEAD^{tree}')"
          fi

          # Orphan commit has no parent: hourly updates do not accumulate Git history.
          git switch --orphan staged-feeds
          git rm -rf --ignore-unmatch . >/dev/null
          git clean -ffdqx >/dev/null
          cp -a "$RUNNER_TEMP/feeds/." ./
          git add -A

          new_tree="$(git write-tree)"
          if [[ "$new_tree" == "$old_tree" ]]; then
            echo 'Published feed is unchanged. Nothing to push.'
            exit 0
          fi

          git commit -m 'Publish validated AbuseIPDB TXT/CSV feeds'
          git push --force-with-lease="refs/heads/feeds:$FEEDS_OLD_HEAD" origin HEAD:refs/heads/feeds

      - name: Report failed publication
        if: failure()
        run: echo '::error::Mirror publication failed. Previous public feeds remain available; inspect logs and rerun after resolving the failure.'

  health:
    if: github.event.schedule == '53 * * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check public mirror freshness
        env:
          MANIFEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/feeds/manifest.json
        run: python3 sync.py --check-url "$MANIFEST_URL"
      - name: Report overdue mirror
        if: failure()
        run: echo '::error::Public mirror freshness check failed. Check publication runs and upstream availability.'
